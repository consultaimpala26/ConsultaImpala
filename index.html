<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Ventana Horaria</title>
  <style>
    :root {
      --primary-purple: #903F98;
      --teal-main: #009991;
      --teal-accent: #009992;
      --dark-navy: #001E33;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-result: #f1f5f9;
      --text-muted: #64748b;
      --error-bg: #fef2f2;
      --error-text: #dc2626;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      background-image: radial-gradient(circle at top right, rgba(0, 153, 145, 0.06), transparent 50%),
                        radial-gradient(circle at bottom left, rgba(144, 63, 152, 0.06), transparent 50%);
      color: var(--dark-navy);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 30, 51, 0.08), 0 8px 10px -6px rgba(0, 30, 51, 0.04);
      padding: 32px 28px;
      max-width: 460px;
      width: 100%;
      position: relative;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      border-top: 5px solid var(--primary-purple);
    }

    /* Encabezado con imagen en la esquina superior derecha */
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
    }

    .header-text {
      flex: 1;
    }

    .header-text h2 {
      margin: 0;
      color: var(--dark-navy);
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .header-text p {
      margin: 4px 0 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .top-right-image {
      max-height: 50px;
      max-width: 120px;
      object-fit: contain;
    }

    /* Formulario de Búsqueda */
    .input-group {
      margin-bottom: 20px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--dark-navy);
      display: block;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--dark-navy);
      background-color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    input[type="text"]:focus {
      border-color: var(--teal-main);
      box-shadow: 0 0 0 4px rgba(0, 153, 145, 0.12);
    }

    /* Caja de Resultados */
    .result-box {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      background-color: var(--bg-result);
      border-left: 5px solid var(--teal-main);
      display: none;
      animation: fadeIn 0.25s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-item {
      margin-bottom: 10px;
    }

    .detail-item:last-child {
      margin-bottom: 0;
    }

    .result-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .result-value {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--dark-navy);
    }

    .result-value-highlight {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--primary-purple);
    }

    .not-found {
      color: var(--error-text);
      border-left-color: var(--error-text);
      background-color: var(--error-bg);
    }

    .not-found .result-value {
      color: var(--error-text);
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.4;
    }

    /* Footer sutil */
    .card-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid #f1f5f9;
      padding-top: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-container">
      <div class="header-text">
        <h2>Consulta de Ventana Horaria</h2>
        <p>Salida de Cochera</p>
      </div>
      <!-- Reemplaza 'logo.png' con el nombre de tu archivo de imagen en GitHub -->
      <img src="logo.png" alt="Logo" class="top-right-image" onerror="this.style.display='none'">
    </div>

    <div class="input-group">
      <label for="searchInput">Ingrese la placa de la unidad (7 caracteres):</label>
      <input type="text" id="searchInput" placeholder="Ej: AYE-825" maxlength="7" oninput="buscarDato()">
    </div>
    
    <div id="result" class="result-box">
      <div id="resultContent"></div>
    </div>

    <div class="card-footer">
      Sistema de Control Operativo
    </div>
  </div>

  <script>
    let dataset = [];

    // Cargar datos desde data.json
    fetch('data.json')
      .then(response => response.json())
      .then(data => { dataset = data; })
      .catch(err => console.error('Error al cargar data.json:', err));

    function buscarDato() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultBox = document.getElementById('result');
      const resultContent = document.getElementById('resultContent');

      // Solo busca cuando la placa tenga exactamente 7 caracteres
      if (query.length < 7) {
        resultBox.style.display = 'none';
        return;
      }

      // Coincidencia exacta con la placa/código
      const item = dataset.find(row => 
        row.CODIGO && row.CODIGO.toString().trim().toLowerCase() === query
      );

      if (item) {
        resultContent.innerHTML = `
          <div class="detail-item">
            <div class="result-title">Placa / Código:</div>
            <div class="result-value">${item.CODIGO}</div>
          </div>
          <div class="detail-item" style="margin-top: 12px;">
            <div class="result-title">Ventana Horaria Asignada:</div>
            <div class="result-value-highlight">${item.VENTANA_HORARIA}</div>
          </div>
        `;
        resultBox.className = 'result-box';
        resultBox.style.display = 'block';
      } else {
        resultContent.innerHTML = `
          <div class="result-value">Por favor consulte con el equipo de cochera sobre su atención. Gracias.</div>
        `;
        resultBox.className = 'result-box not-found';
        resultBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
